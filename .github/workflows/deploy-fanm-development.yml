name: Deploy 5 Asides Near Me Development

on:
  push:
    branches:
      - fanm-development
  workflow_dispatch:

concurrency:
  group: fanm-development-deployment
  cancel-in-progress: true

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fanm-development
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build development site
        run: npm run build:production
        env:
          VITE_FIREBASE_ENV: production
          VITE_FANM_DEVELOPMENT_SITE: "true"
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}

      - name: Deploy FANM development site
        run: |
          npm install -g firebase-tools
          firebase deploy --only hosting:development --project five-asides-near-me --token "${{ secrets.FIREBASE_TOKEN }}"
