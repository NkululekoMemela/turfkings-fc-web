name: Deploy 5 Asides Near Me Production

on:
  push:
    branches:
      - fanm-production

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build 5 Asides Near Me
        run: npm run build:production
        env:
          VITE_FIREBASE_ENV: production

      - name: Deploy to Firebase 5 Asides Near Me
        run: |
          npm install -g firebase-tools
          firebase deploy --only hosting:production --project five-asides-near-me --token "${{ secrets.FIREBASE_TOKEN }}"
